name: .NET 8 build and test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/first-usable-desktop
      - feature/persistent-development-agent
      - bounded-autonomous-loop
      - feature/local-mcp-development-bridge
  pull_request:
    branches:
      - feature/safe-workspace-tools
      - bounded-autonomous-loop

concurrency:
  group: jarvis-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python for upstream Indian Trader tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Indian Trader offline tests
        run: python -m unittest discover -s integrations/indian-trader/tests -v

      - name: Restore
        run: dotnet restore JARVIS.Council.sln

      - name: Build
        run: dotnet build JARVIS.Council.sln --configuration Release --no-restore

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }

      - name: Test
        run: dotnet test JARVIS.Council.sln --configuration Release --no-build --no-restore
