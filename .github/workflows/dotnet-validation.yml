name: .NET 8 build and test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/first-usable-desktop
      - feature/persistent-development-agent
      - bounded-autonomous-loop
      - feature/local-mcp-development-bridge
      - 'integration/**'
      - 'fix/**'
  pull_request:
    branches:
      - feature/safe-workspace-tools
      - bounded-autonomous-loop
      - 'integration/**'

concurrency:
  group: jarvis-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Indian Trader offline tests
        shell: pwsh
        run: |
          $agentInstall = Join-Path $PWD 'integrations/.claude/agents'
          New-Item -ItemType Directory -Force -Path $agentInstall | Out-Null
          Copy-Item 'integrations/indian-trader/agents/*.md' $agentInstall -Force
          try {
            python -m unittest discover -s integrations/indian-trader/tests -v
            if ($LASTEXITCODE -ne 0) { throw 'Indian Trader offline tests failed.' }
          } finally {
            Remove-Item (Join-Path $PWD 'integrations/.claude') -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Restore
        run: dotnet restore JARVIS.Council.sln

      - name: Build
        run: dotnet build JARVIS.Council.sln --configuration Release --no-restore

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
              throw "PowerShell syntax validation failed."
            }
          }

      - name: Check desktop text for garbled characters
        shell: pwsh
        run: |
          # UTF-8 text misread by Windows PowerShell 5.1 shows up as sequences such as U+0393 U+00C7 or U+252C U+2556.
          $markers = @([string][char]0x0393 + [char]0x00C7, [string][char]0x0393 + [char]0x00F9, [string][char]0x0393 + [char]0x00FB,
                       [string][char]0x252C + [char]0x2556, [string][char]0x2261 + [char]0x0192, [string][char]0x2229 + [char]0x255D)
          $bad = Get-ChildItem src -Recurse -Include *.xaml,*.cs | Where-Object {
            $text = Get-Content $_.FullName -Raw -Encoding UTF8
            $markers | Where-Object { $text.Contains($_) }
          }
          if ($bad) { $bad | ForEach-Object { Write-Error "Garbled characters in $($_.FullName)" }; throw "Fix the text encoding in the files above." }

      - name: Test Python worker and wake-word scripts
        run: python -m unittest discover -s tests/python -v

      - name: Test
        run: dotnet test JARVIS.Council.sln --configuration Release --no-build --no-restore
