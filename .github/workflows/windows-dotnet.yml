name: Windows .NET 8 build and tests

on:
  push:
    branches:
      - unified/jarvis-available
      - feature/durable-checkpoints-brave-manager
  pull_request:
    branches:
      - unified/jarvis-available

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\JARVIS.Council.sln

      - name: Build
        run: dotnet build .\JARVIS.Council.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\JARVIS.Council.sln --configuration Release --no-build --logger "trx;LogFileName=jarvis-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
