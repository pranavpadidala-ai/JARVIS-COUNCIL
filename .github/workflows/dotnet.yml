name: .NET build and tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore JARVIS.Council.sln

      - name: Build solution
        run: dotnet build JARVIS.Council.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test JARVIS.Council.sln --configuration Release --no-build --logger "console;verbosity=normal"
